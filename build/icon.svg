<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" role="img" aria-label="Tawny Orch folded ribbon T logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E5E8ED" />
    </linearGradient>
    <linearGradient id="gradOrange" gradientUnits="userSpaceOnUse" x1="130" y1="180" x2="300" y2="200">
      <stop offset="0%" stop-color="#FF9100" />
      <stop offset="50%" stop-color="#FF3D00" />
      <stop offset="100%" stop-color="#D50000" />
    </linearGradient>
    <linearGradient id="gradPurple" gradientUnits="userSpaceOnUse" x1="240" y1="175" x2="285" y2="300">
      <stop offset="0%" stop-color="#D50000" />
      <stop offset="40%" stop-color="#6A1B9A" />
      <stop offset="100%" stop-color="#2962FF" />
    </linearGradient>
    <linearGradient id="gradCyan" gradientUnits="userSpaceOnUse" x1="285" y1="300" x2="240" y2="245">
      <stop offset="0%" stop-color="#2962FF" />
      <stop offset="50%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#1DE9B6" />
    </linearGradient>
    <filter id="ribbonShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="10" stdDeviation="8" flood-color="#000720" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="500" height="500" rx="115" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="6" />
  <g filter="url(#ribbonShadow)">
    <path d="M 240 175 C 310 120, 370 150, 370 210 C 370 270, 310 270, 285 300" fill="none" stroke="url(#gradPurple)" stroke-width="56" stroke-linecap="round" />
    <path d="M 220 265 C 160 220, 130 220, 130 180 C 130 120, 260 120, 300 200" fill="none" stroke="url(#gradOrange)" stroke-width="56" stroke-linecap="round" />
    <path d="M 285 300 C 285 380, 190 380, 190 320 C 190 260, 210 255, 240 245" fill="none" stroke="url(#gradCyan)" stroke-width="56" stroke-linecap="round" />
  </g>
</svg>
